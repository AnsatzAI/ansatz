[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ansatz"
version = "0.1.0"
description = "Learned solver routing for superconducting qubit design: surrogate-accelerated, residual-verified electromagnetic simulation."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Ansatz AI", email = "contact@useansatz.ai" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyamg>=5.0",
    "torch>=2.1",
    "pandas>=2.0",
    "huggingface_hub>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4", "matplotlib>=3.7", "datasets>=2.16", "scikit-learn>=1.3"]

[project.urls]
Homepage = "https://useansatz.ai"
Repository = "https://github.com/AnsatzAI/ansatz"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
